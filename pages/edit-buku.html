<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Buku</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow">

        <a href="../index.html" class="text-blue-600">
            &larr; Kembali
        </a>

        <h1 class="text-2xl font-bold mt-4 mb-6">
            Edit Data Buku
        </h1>

        <form id="form-edit">

            <div class="mb-4">
                <label class="block mb-1">Judul Buku</label>
                <input type="text" id="judul_buku"
                    class="w-full border rounded-lg p-2" required>
            </div>

            <div class="mb-4">
                <label class="block mb-1">Penulis</label>
                <input type="text" id="penulis"
                    class="w-full border rounded-lg p-2" required>
            </div>

            <div class="mb-4">
                <label class="block mb-1">Penerbit</label>
                <input type="text" id="penerbit"
                    class="w-full border rounded-lg p-2" required>
            </div>

            <div class="mb-4">
                <label class="block mb-1">Tahun Terbit</label>
                <input type="number" id="tahun_terbit"
                    class="w-full border rounded-lg p-2" required>
            </div>

            <div class="mb-4">
                <label class="block mb-1">Stok</label>
                <input type="number" id="stok"
                    class="w-full border rounded-lg p-2" min="0" required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                Simpan Perubahan
            </button>

        </form>

        <p id="pesan" class="mt-4 text-sm"></p>

    </div>

    <script src="../assets/edit-buku.js" defer></script>

</body>
</html>
